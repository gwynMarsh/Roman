<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic-Roman Number Converter</title>
    <!-- Tailwind CSS for modern styling and responsiveness -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        /* Custom scrollbar and smooth transitions */
        body { transition: background-color 0.3s, color 0.3s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header & Theme Toggle -->
    <header class="w-full max-w-2xl mx-auto p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight">🏛️ Roman Converter</h1>
        <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:scale-105 transition">
            <span id="themeIcon">🌙</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl mx-auto p-4 flex-grow flex flex-col gap-6">
        
        <!-- Context Helper Banner -->
        <div class="bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 p-4 rounded-2xl text-sm">
            <h2 class="font-semibold text-indigo-900 dark:text-indigo-300 mb-1">📖 Quick Use Cases</h2>
            <p class="text-indigo-700 dark:text-indigo-400">Great for decoding legal acts (e.g., Act <em>XLIV</em>), movie/book publication years (e.g., MCMXCVIII = 1998), and birth/death dates on historical headstones.</p>
        </div>

        <!-- Section 1: Arabic to Roman -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
            <label for="arabicInput" class="block text-sm font-medium mb-2 text-slate-500 dark:text-slate-400">Arabic Number (1 - 3999)</label>
            <input type="number" id="arabicInput" placeholder="e.g., 2026" min="1" max="3999" 
                class="w-full text-2xl font-semibold bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                oninput="convertArabicToRoman()">
            
            <div class="mt-4">
                <span class="text-xs text-slate-400 uppercase tracking-wider font-bold">Result:</span>
                <div id="arabicResult" class="text-3xl font-mono font-bold text-indigo-600 dark:text-indigo-400 mt-1 min-h-[40px]">MMXXVI</div>
            </div>
        </div>

        <!-- Section 2: Roman Chips Builder to Arabic -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-sm font-medium text-slate-500 dark:text-slate-400">Roman Numerals (Tap chips to build)</label>
                <button onclick="clearChips()" class="text-xs text-rose-500 hover:underline font-medium">Clear Sequence</button>
            </div>

            <!-- Roman Chips Input Area -->
            <div id="chipDisplay" class="w-full min-h-[60px] bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-3 flex flex-wrap items-center gap-2 mb-4 font-mono text-xl font-bold">
                <span class="text-slate-400 text-sm font-normal italic" id="placeholderText">Tap chips below...</span>
            </div>

            <!-- Chips Palette -->
            <div class="grid grid-cols-7 gap-2">
                <button onclick="appendRoman('M')" class="py-3 bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 dark:hover:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-bold rounded-xl transition active:scale-95">M <span class="block text-[10px] font-normal opacity-75">1000</span></button>
                <button onclick="appendRoman('D')" class="py-3 bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 dark:hover:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-bold rounded-xl transition active:scale-95">D <span class="block text-[10px] font-normal opacity-75">500</span></button>
                <button onclick="appendRoman('C')" class="py-3 bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 dark:hover:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-bold rounded-xl transition active:scale-95">C <span class="block text-[10px] font-normal opacity-75">100</span></button>
                <button onclick="appendRoman('L')" class="py-3 bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 dark:hover:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-bold rounded-xl transition active:scale-95">L <span class="block text-[10px] font-normal opacity-75">50</span></button>
                <button onclick="appendRoman('X')" class="py-3 bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 dark:hover:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-bold rounded-xl transition active:scale-95">X <span class="block text-[10px] font-normal opacity-75">10</span></button>
                <button onclick="appendRoman('V')" class="py-3 bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 dark:hover:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-bold rounded-xl transition active:scale-95">V <span class="block text-[10px] font-normal opacity-75">5</span></button>
                <button onclick="appendRoman('I')" class="py-3 bg-indigo-100 dark:bg-indigo-900/50 hover:bg-indigo-200 dark:hover:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-bold rounded-xl transition active:scale-95">I <span class="block text-[10px] font-normal opacity-75">1</span></button>
            </div>
            
            <div class="mt-4 flex justify-between items-center">
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-bold">Converted Value:</span>
                    <div id="romanResult" class="text-3xl font-bold text-indigo-600 dark:text-indigo-400 mt-1">0</div>
                </div>
                <button onclick="backspaceRoman()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl text-sm font-medium transition">⌫ Delete Last</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-400">
        Built for decoding history &bull; Open source on GitHub
    </footer>

    <!-- JavaScript Converter Logic -->
    <script>
        // --- Dark Mode Handler ---
        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Initialize theme based on preference
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').textContent = '☀️';
        }

        // --- Conversion Engines ---
        const romanMap = { M: 1000, D: 500, C: 100, L: 50, X: 10, V: 5, I: 1 };
        let currentChips = [];

        function arabicToRoman(num) {
            if (num < 1 || num > 3999) return "Out of range (1-3999)";
            const lookup = {M:1000, CM:900, D:500, CD:400, C:100, XC:90, L:50, XL:40, X:10, IX:9, V:5, IV:4, I:1};
            let roman = "";
            for (let i in lookup) {
                while (num >= lookup[i]) {
                    roman += i;
                    num -= lookup[i];
                }
            }
            return roman;
        }

        function romanToArab(str) {
            str = str.toUpperCase();
            if (!str) return 0;

            // Strict validation regex for standard Roman numerals 1 - 3999
            const romanRegex = /^(M{0,3})(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/;
            if (!romanRegex.test(str)) {
                return "Invalid Roman Numeral";
            }

            let total = 0;
            for (let i = 0; i < str.length; i++) {
                let current = romanMap[str[i]];
                let next = romanMap[str[i + 1]];
                if (next && current < next) {
                    total += (next - current);
                    i++; // skip next
                } else {
                    total += current;
                }
            }
            return total;
        }

        // --- UI Interactions ---
        function convertArabicToRoman() {
            const val = parseInt(document.getElementById('arabicInput').value);
            const resEl = document.getElementById('arabicResult');
            if (!val || val < 1) {
                resEl.textContent = "---";
                return;
            }
            resEl.textContent = arabicToRoman(val);
        }

        function appendRoman(char) {
            currentChips.push(char);
            updateChipDisplay();
        }

        function backspaceRoman() {
            currentChips.pop();
            updateChipDisplay();
        }

        function clearChips() {
            currentChips = [];
            updateChipDisplay();
        }

        function updateChipDisplay() {
            const container = document.getElementById('chipDisplay');
            container.innerHTML = '';
            
            if (currentChips.length === 0) {
                container.innerHTML = '<span class="text-slate-400 text-sm font-normal italic" id="placeholderText">Tap chips below...</span>';
                document.getElementById('romanResult').textContent = '0';
                return;
            }

            currentChips.forEach((char, index) => {
                const chip = document.createElement('span');
                chip.className = 'px-2.5 py-1 bg-indigo-50 dark:bg-indigo-950 border border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-300 rounded-lg text-lg';
                chip.textContent = char;
                container.appendChild(chip);
            });

            // Calculate value or show error format
            const romanString = currentChips.join('');
            const result = romanToArab(romanString);
            
            const resultEl = document.getElementById('romanResult');
            resultEl.textContent = result;
            
            if (result === "Invalid Roman Numeral") {
                resultEl.className = "text-xl font-bold text-rose-500 mt-1";
            } else {
                resultEl.className = "text-3xl font-bold text-indigo-600 dark:text-indigo-400 mt-1";
            }
        }

        // Run default state setup on load
        document.getElementById('arabicInput').value = 2026;
        convertArabicToRoman();
    </script>
</body>
</html>
